<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jemma’s Pokédex</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#7A1E2A">
<!-- light unless she has pressed Dark mode (her rule, 21 Nov: never by the device's setting); set before the page draws, so it never flashes -->
<script>try{document.documentElement.setAttribute("data-mode",localStorage.getItem("jemmas-pokedex-mode")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-mode","light")}</script>
<link rel="stylesheet" href="site.css?v=804ad7e9">
</head>
<body>
<!-- narrow windows and phones (21 Nov, her ask: like her other apps): a slim top bar with a Menu button; the sidebar opens as a drawer -->
<div class="topbar" id="topbar"><button id="menuBtn" type="button" aria-controls="side" aria-expanded="false" aria-label="Open the menu"><span id="menuIco"></span>Menu</button><a class="topname" href="#home">Jemma’s <em>Pokédex</em></a></div>
<div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="Pokédex">
  <!-- HOME LINK: back to Jemma’s Journals, her home site (her pick A, 20 Nov). The address is this href alone: "/" is home
       once the sites share one address online (home at the root, the apps under it); locally it opens this app’s own start. -->
  <a class="home-link" id="homeLink" href="/">← Jemma’s Journals</a>
  <a class="brand" href="#home"><b>Jemma’s <em>Pokédex</em></b><small>Pokémon GO</small></a>
  <div class="search"><span class="search-ico" id="searchIco"></span><input id="q" type="search" placeholder="Name or number…" aria-label="Search the Pokédex" autocomplete="off" spellcheck="false"></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main id="main"><div class="wrap" id="view" tabindex="-1"></div>
  <!-- at the foot of every page (her ask, 21 Nov, as on Jemma’s Journals): Back to top, and Dark mode / Light mode -->
  <footer class="foot"><div class="foot-links"><button type="button" class="totop" id="toTop"></button><button type="button" class="mode-text" id="modeBtn" aria-pressed="false"></button></div></footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/icons.js?v=58749ce0"></script>
<script src="js/data.js?v=83b82c96"></script>
<script src="js/app.js?v=351484aa"></script>
</body>
</html>
